name: Build and publish Docker image

# Builds the image for linux/amd64 and linux/arm64 and pushes it to this
# repository's GitHub Container Registry package.
#
# **Why more than one architecture.** `README.md` documents `docker run` as a
# supported way to run this server, so the image has to work on the machines readers
# have. Two cover almost all of them: x86-64 servers and PCs, and arm64, which is
# Apple Silicon Macs and arm64 cloud instances. Publishing only x86-64 does not
# degrade on arm64, it fails: Docker refuses to pull an image with no entry for the
# host architecture, and forcing it with `--platform linux/amd64` runs the headless
# Chromium this image exists to carry under emulation.
#
# **Adding another architecture later.** It is one more entry in `platforms:` below,
# but only where both the base image and Debian's `chromium` exist for it. Debian 13
# builds `chromium` for amd64, arm64, armhf, i386 and ppc64el, and `python:3.13-slim`
# covers all of those, so `linux/386` and `linux/ppc64le` would work if anyone asks.
# Two to avoid: `linux/arm/v7` builds, but Debian's armhf `chromium` is three major
# versions behind with no security updates and a removal request open, so it would
# ship a knowingly unpatched browser; `linux/s390x` and `linux/riscv64` have no
# Debian `chromium` at all and would fail at `apt-get install`. Each platform added
# is another emulated build leg, so the list is short on purpose rather than by
# oversight.
#
# **About arm64 and Chromium.** Publishing an arm64 image does not change whether
# Debian's arm64 `chromium` works on a given host; it only saves that host the
# build. It was measured starting and rendering pages on two arm64 hosts before this
# landed -- see the commit that added this file. Both use 4 KiB memory pages, which
# is worth recording because Chromium's arm64 build assumes that, and arm64 machines
# with 16 KiB pages are known to break it.
#
# **What each trigger does.**
#
# - `push` to the default branch: build and push. The tag list below is what
#   produces `:latest`, `:main`, `:sha-<short>` and `:<package version>`.
# - `push` of a `v*` tag: build and push the `type=semver` tags. ⚠️ **Nothing
#   produces such a tag today** -- this repository has no tags and no releases, so
#   that half has never fired. It is kept rather than deleted because a release
#   process is the intended direction, and the version tag on the default-branch
#   path is what gives the image a version identity until then. Starting to
#   release means tagging `v<version>` to match `pyproject.toml`.
# - `pull_request`: build both architectures and push nothing, so a `Dockerfile`
#   change that breaks arm64 shows up here instead of in the next release. ⚠️ It is
#   a signal, not a gate: nothing `needs:` this job and `ci-required` does not
#   include it, so on its own it blocks no merge -- recorded as one of exactly two
#   such jobs in `JOBS_OUTSIDE_THE_REQUIRED_AGGREGATE`. It is also the only shape a
#   fork can run, because nothing on that path needs a credential.
#   ⚠️ Not a full rehearsal of publishing, and precisely which parts differ is
#   worth getting right: `push:` is false here, so nothing reaches the registry
#   and `cache-to:` is skipped. The provenance attestation is **still generated**
#   -- `provenance:` below is an unconditional input, and run 35456340639's build
#   command carries `--attest type=provenance,mode=max` on this very path. What a
#   pull request does not rehearse is publication, not attestation.
# - `workflow_dispatch`: a manual rebuild, for a base image or OS package update
#   that no commit here triggers. It builds with `no-cache:` for that reason -- the
#   `apt-get` layer is keyed on the base image digest and the command, so a cached
#   run would republish the same `chromium` it built weeks ago.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Limited to `main`, like `ci.yml`. Deliberately not limited by path: the list
  # would be short, because `.dockerignore` only admits `pyproject.toml`,
  # `README.md` and `src/`, but the day it missed a path the build context does
  # admit, this check would stop running and nothing would go red. That is the same
  # reason `.dockerignore` is an allowlist rather than a denylist. The cost is wall
  # clock rather than money, because standard runners are free on a public
  # repository: a pull request that changes nothing in the build context restores
  # the default branch's layers from the cache below, and one that changes `src/`,
  # `pyproject.toml` or `README.md` runs `pip install` again on both architectures.
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # `metadata-action` lowercases this for the registry, so a mixed-case owner or
  # repository name does not have to be written out here.
  IMAGE_NAME: ${{ github.repository }}

# One build per ref, scoped the same way `ci.yml` scopes its own. Without this, a
# run of quick pushes to the default branch starts a full build for each one while
# the earlier builds are still going, and every one of them emulates arm64.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ **One emulated job, rather than one native job per architecture.** Standard
# `ubuntu-24.04-arm` runners are free and unlimited on a public repository, so the
# faster shape is available: one job per architecture pushing by digest, plus a job
# that merges them with `buildx imagetools create`. That costs three jobs instead of
# one, digests passed between them, a second runner label in this repository's
# recorded ceilings, and a pull-request path with more than one cache scope. This
# job is the simple end of that trade, and what emulation costs is wall clock on a
# free runner. Say so if the balance should go the other way.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 🔴 **Paired with the runner label, per `DeclaredJobCapIsEnforceableTests`.**
    # `ubuntu-latest`'s ceiling is 360 minutes, so 60 is a number that can actually
    # be enforced. It is the same 60 that `tests-broad.yml`'s matrix and the review
    # job use, and for the same reason: a safety net, not a budget. The arm64 half
    # runs under emulation, and a stuck build would otherwise hold a runner for six
    # hours.
    #
    # **Measured.** Not every cap here is -- `ci-required` declares 10 minutes on
    # the reasoning that it starts a shell and exits -- but this is the
    # repository's longest-running job by far, so a figure is worth more than an
    # argument. Two runs, both on the PULL-REQUEST path -- run 35434307949, the
    # first on this branch, whole job 5m49s with the build step 5m26s on a cold
    # cache; and run 35456340639, build step 5m30s. The emulated arm64 leg
    # dominates both: `apt-get install chromium` took ~20s on amd64 and ~2m30s on
    # arm64.
    #
    # ⚠️ **Both figures are the pull-request path**, which pushes nothing and
    # exports no cache, so they are the floor of this job's work rather than its
    # slowest shape. With roughly ten times the headroom that changes no
    # decision, but the next person to compare against a `main` run should know
    # which path these came from. If a later run approaches the cap, the native
    # `ubuntu-24.04-arm` shape weighed in the header is the trade to revisit,
    # not this number.
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout
      packages: write # push to this repository's GHCR package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Registers the handlers that let an x86-64 runner execute arm64 build steps.
      # Needed because the `Dockerfile` runs `apt-get` and `pip install` inside the
      # target architecture rather than cross-compiling.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # BuildKit, which `platforms:` and the cache below both need.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 🔴 Skipped on pull requests, and that matters rather than being tidiness:
      # nothing is pushed on that path -- see `push:` on the build step -- so a login
      # would authenticate for work that never happens.
      #
      # ⚠️ **The usual reassurance here is narrower than it reads.** A pull request
      # from a FORK gets a read-only `GITHUB_TOKEN`, so `packages: write` is
      # reduced to read and a push would fail whether or not the login ran. That is
      # true, and it is not true of a pull request from a branch in this
      # repository, which gets the declared `packages: write`. This repository
      # takes both shapes. For the branch shape the `push:` expression below is the
      # ONLY thing between a pull request and a publish, which is why
      # `PublishConditionIsPairedTests` pairs these two lines rather than trusting
      # them: `docker/build-push-action` defaults `push` to false, so deleting that
      # line stops publishing silently and green.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and image labels. `org.opencontainers.image.source` is one of the
      # labels below. GitHub documents it as what connects a package to a repository
      # when the push comes from outside Actions; a push from a workflow using
      # `GITHUB_TOKEN` is connected to its own repository either way.
      #
      # 🔴 **Connected is not the same as public.** A connected package inherits the
      # repository's permissions but not its visibility, and GitHub creates a new
      # package as private even under a public repository. So after the first
      # successful run on `main`, someone has to change the package's visibility
      # once before `docker pull` works for anyone not logged in.
      # 🔴 **The version is READ, never written here.** `pyproject.toml` is what
      # `packaging.md` calls the published version, so a literal in this file
      # would be a second place to bump and the one nobody remembers -- the
      # package moves to 0.2.0 and the image keeps tagging 0.1.9. The emptiness
      # check matters as much as the `sed`: without it a malformed file yields
      # `version=`, and `metadata-action` is handed a tag with no value instead
      # of the run going red. `VersionTagIsDerivedTests` executes this step
      # against the real file rather than matching its text.
      - name: Read the package version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test -n "$version" || { echo "pyproject.toml declares no version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` comes from the explicit `type=raw` line below rather than from
          # the action's default, which would also move it on a tag push.
          flavor: |
            latest=false
          # ⚠️ **The last line is the version tag, and it MOVES.** Nothing in this
          # repository produces a `v*` tag today -- there are no tags and no
          # releases -- so the three `type=semver` lines have never fired, and
          # without the last line the image would carry no version identity at
          # all: a reader could not tell which package version a `:latest`
          # contains. It names the newest default-branch build carrying that
          # package version, so `:0.1.9` moves with every push to `main` until
          # `pyproject.toml` changes. That is the deliberate trade -- the
          # alternative, emitting it only on a `v*` tag, produces nothing until a
          # release process exists. Immutability comes from the digest, which
          # README documents beside the pull command.
          #
          # Comments live here rather than inside the block below: `tags: |` is a
          # literal scalar, so a `#` line inside it is a tag pattern, not a note.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # See the header before adding to this list: an architecture only works
          # here if Debian ships a `chromium` for it. Pinned as a set by
          # `PublishedPlatformsArePinnedTests`, which also holds README to naming
          # the machines this actually builds for -- removing one is otherwise a
          # change that goes green and is found by somebody whose `docker pull`
          # reports no matching manifest.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 🔴 **Declared, because leaving it out does not mean "off".** With no
          # `provenance:` input the action picks a default from the repository's
          # visibility -- `mode=max` on a public repository, `mode=min,inline-only`
          # on a private one (`docker/build-push-action`, `src/context.ts`,
          # `getAttestArgs`). So this job was already publishing a full provenance
          # attestation and nothing here said so; run 35434307949's build command
          # carries `--attest type=provenance,mode=max`. The value is unchanged,
          # but writing it out replaces a default CONDITIONAL on repository
          # visibility with an unconditional decision -- this no longer changes
          # meaning if the repository is ever made private. What it publishes
          # beside the image: attestation manifests, which the GHCR package page
          # renders as `unknown/unknown` rows next to the two real platforms, and
          # the full build environment. `false` would give a two-entry manifest
          # list matching README's promise exactly, at the cost of the attestation.
          provenance: mode=max
          # A manual rebuild is the one run that must not reuse the `apt-get` layer;
          # see `workflow_dispatch` in the header.
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          # Written only on the publishing paths. A pull request's cache belongs to
          # its own merge ref, so only a re-run of that same pull request could read
          # it back, and it still uses the repository's shared 10 GB. Over that limit
          # GitHub deletes caches "in order of last access date, from oldest to most
          # recent", so writing one cache per pull request costs the default branch's
          # older layers and buys almost nothing.
          #
          # ⚠️ **`mode=min`, and that is paired with the `Dockerfile`.** `max`
          # exports every intermediate layer, which earns its size only on a
          # multi-stage build where those layers are discarded from the final
          # image. `Dockerfile` declares ONE `FROM`, so every layer it builds --
          # including the expensive `apt-get install chromium` and `pip install` --
          # is already exported by `min`. Over a single stage the two cache the
          # same work and `max` merely spends more of a 10 GB budget this workflow
          # is the only consumer of, evicting its own older entries sooner. The day
          # a second `FROM` lands, `min` starts costing real rebuild time and
          # nothing here would look wrong, so `CacheModeMatchesTheBuildTests` makes
          # the two files check each other.
          #
          # ⚠️ The first build after this lands is NOT a clean measurement of that
          # trade: `cache-from` keeps reading the `mode=max` entries run
          # 35434307949 already wrote, until they age out of the 10 GB.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=min' || '' }}
